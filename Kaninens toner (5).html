<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaninens toner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#4a9ff0,#bfe4ff 70%,#e8f6ff);font-family:"Trebuchet MS",system-ui,sans-serif;color:#10294d;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1{margin:4px 0;font-size:1.5rem;text-align:center;color:#fff;text-shadow:0 2px 0 #2a6fc0}
.bar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 20px;background:#ff8fab;color:#fff;box-shadow:0 4px 0 #d9658a;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9658a}
label,select{font:inherit;font-size:.95rem;font-weight:700;color:#10294d}
select{border-radius:10px;padding:6px;border:2px solid #fff;background:#fff}
#msg{min-height:1.6em;text-align:center;font-size:1.25rem;font-weight:800;margin:4px 0}
details{text-align:center;font-weight:800;margin:6px 0}summary{cursor:pointer;display:inline-block;background:#fff;border-radius:999px;padding:6px 16px}
#inslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
#inslist label{background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
svg{width:100%;height:auto;display:block;background:linear-gradient(#3b97ee,#bfe6ff);border-radius:18px}
.kb{position:relative;height:200px;margin-top:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.w,.b{position:absolute;border:2px solid #222;cursor:pointer;font-weight:800;display:flex;flex-direction:column;align-items:center;transition:filter .15s,transform .1s,opacity .2s}
.w{top:0;height:100%;border-radius:0 0 10px 10px;justify-content:flex-end;padding-bottom:12px;color:#111}
.b{top:0;height:58%;border-radius:0 0 8px 8px;justify-content:flex-start;padding-top:12px;color:#fff;z-index:2}
.kb small{font-size:.6em;opacity:.65;font-weight:700}
.off{opacity:.35;pointer-events:none;cursor:default}
.w:active,.b:active{filter:brightness(1.15);transform:translateY(2px)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.35) saturate(1.4);box-shadow:0 0 18px 6px #fff}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.2)}to{transform:scale(1)}}
.dc{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(1080px)}to{transform:translateX(-220px)}}
.cf{transform-box:fill-box;transform-origin:center;animation:conf 1.8s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.world{border-radius:18px;padding:12px;margin:12px 0;color:#10294d}.world h2{margin:0 0 8px}
.lv{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.node{border-radius:16px;padding:8px 12px;min-width:96px;display:flex;flex-direction:column;align-items:center;background:#fff;color:#10294d;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.node:disabled{opacity:.5;cursor:default}.node b{font-size:1.4rem}.node small{font-size:.7rem;font-weight:600}
.tg{background:#9bb7d9;box-shadow:0 4px 0 #6f8fb6}.tg.on{background:#ff8fab;box-shadow:0 4px 0 #d9658a}
#banner{background:#fff;border-radius:14px;padding:10px;text-align:center;font-weight:800;margin:8px 0}
#hearts{position:relative;display:inline-block;font-size:1.5rem}.hr{position:relative;display:inline-block;margin:0 1px}.hf{position:absolute;left:0;top:0}
#hearts.hit{animation:hit .6s}@keyframes hit{20%{transform:translateX(-6px) scale(1.25)}40%{transform:translateX(6px) scale(1.25)}60%{transform:translateX(-4px)}}
.minus{position:absolute;left:50%;top:-4px;font-size:1rem;font-weight:800;color:#d12a52;animation:rise 1s forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-28px);opacity:0}}
#result{position:fixed;inset:0;background:rgba(16,41,77,.55);display:none;align-items:center;justify-content:center;z-index:10}
.card{background:#fff;border-radius:22px;padding:20px 26px;text-align:center;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.row{font-size:3.2rem;display:flex;justify-content:center;gap:10px;margin:10px 0}
.slot.star{animation:starpop .6s}@keyframes starpop{0%{transform:scale(.3) rotate(-90deg)}60%{transform:scale(1.5) rotate(20deg)}100%{transform:scale(1)}}
.slot.dim{opacity:.4}.card button{margin:6px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.1s infinite alternate}
@keyframes pl{to{transform:scale(1.3);opacity:.15}}
.bob{animation:bob .8s infinite alternate ease-in-out}@keyframes bob{to{transform:translateY(-7px)}}
.nd{cursor:pointer}
.tw{animation:tw 2.4s infinite}@keyframes tw{50%{opacity:.15}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 1.8s ease-in-out infinite}@keyframes sp{50%{transform:scale(1.25)}}
.ff{animation:ff 5s ease-in-out infinite alternate}@keyframes ff{to{transform:translate(16px,-12px);opacity:.25}}
.fog{animation:fg 16s ease-in-out infinite alternate}@keyframes fg{to{transform:translateX(70px)}}
.bat{animation:fly 22s linear infinite}@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(960px)}}
.eye{animation:bl 5s infinite}@keyframes bl{0%,90%,100%{opacity:.95}94%{opacity:0}}
.pill{display:inline-block;background:linear-gradient(#ffe066,#ffb300);color:#7a4300;border-radius:999px;padding:6px 18px;font-weight:900;box-shadow:0 3px 0 #c27a00;font-size:1.15rem}
.pbar{height:14px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden;max-width:360px;margin:6px auto;box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
.pbar i{display:block;height:100%;background:linear-gradient(#b6ff8a,#2ecc40);border-radius:8px}
.flow{animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-62}}
.px{animation:pxf 2s ease-in-out infinite alternate}@keyframes pxf{from{opacity:.5}to{opacity:1}}
.breath{animation:br 3s ease-in-out infinite alternate}@keyframes br{from{opacity:.45}to{opacity:.95}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:brt 2.4s ease-in-out infinite}@keyframes brt{50%{transform:scaleY(1.04)}}
.gr{background:#4cc764!important;box-shadow:0 4px 0 #2e9a47!important}.rd{background:#ef5b50!important;box-shadow:0 4px 0 #b83a31!important}.bl{background:#4a90e2!important;box-shadow:0 4px 0 #2f6bb3!important}
@keyframes hurt{from{box-shadow:inset 0 0 70px 24px rgba(255,60,80,.75)}to{box-shadow:inset 0 0 0 0 rgba(255,60,80,0)}}.hurt{animation:hurt .7s}
.ulist{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:14px 0}
.ucard{position:relative;background:#fff;border-radius:20px;padding:14px 22px;min-width:140px;text-align:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);font-weight:800}
.uav{font-size:2.6rem}.unm{font-size:1.15rem}
.ud{position:absolute;top:4px;right:4px;padding:2px 8px;font-size:.9rem;box-shadow:none;background:#c9d2de;color:#10294d}
#uname{font:inherit;font-size:1.1rem;padding:10px 14px;border-radius:999px;border:3px solid #fff;min-width:200px}
</style>
</head>
<body>
<div class="wrap">
  <div id="userView" style="display:none"></div>
  <div id="mapView"></div>
  <div id="gameView" style="display:none">
    <h1 id="gt">🐰 Kaninens toner</h1>
    <div class="bar">
      <button id="back" class="gr">🗺️ Karta</button>
      <button id="go" class="rd">↻ Börja om</button>
      <button id="again" style="background:#6aa8e8;box-shadow:0 4px 0 #4a85c2">🔊 Lyssna igen</button>
      <span class="pill" id="tot" style="font-size:1rem"></span>
      <span id="hearts" style="font-size:1.4rem"></span>
      <span id="free">
        <select id="mode"><option value="t1">G-klav · 1 oktav</option><option value="t2">G-klav · 2 oktaver</option><option value="b1">F-klav (bas) · 1 oktav</option><option value="b2">F-klav (bas) · 2 oktaver</option></select>
        <label><input type="checkbox" id="blk"> Svarta tangenter</label>
      </span>
      <span id="ins" title="Instrument"></span>
    </div>
    <div id="msg"></div>
    <details id="insbox"><summary>🎼 Välj instrument</summary><div id="inslist"></div></details>
    <svg id="sky" viewBox="0 0 860 340"></svg>
    <div class="kb" id="kb"></div>
    <div id="mic" style="display:none;text-align:center;margin-top:12px">
      <div id="micTxt" style="font-weight:800;font-size:1.25rem">🎤 Sjung!</div>
      <div style="position:relative;height:34px;max-width:520px;margin:8px auto;background:rgba(255,255,255,.65);border-radius:18px;overflow:hidden"><div style="position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#2e9a47"></div><div id="tmk" style="position:absolute;top:4px;width:26px;height:26px;border-radius:50%;background:#ff8fab;left:50%;margin-left:-13px;transition:left .06s;opacity:.3"></div></div>
      <div style="max-width:520px;margin:0 auto;height:14px;background:rgba(0,0,0,.2);border-radius:8px;overflow:hidden"><i id="hold" style="display:block;height:100%;width:0;background:linear-gradient(#b6ff8a,#2ecc40)"></i></div>
      <div id="micErr" style="font-weight:700;margin-top:6px"></div>
    </div>
    <div id="result"></div>
  </div>
</div>
<script>
const LET=['C','C#','D','D#','E','F','F#','G','G#','A','A#','H'];
const DIA=[0,0,1,1,2,3,3,4,4,5,5,6];
const COL=['#ef5b50','#9e2b22','#f29c4a','#c27a22','#f7e26b','#8fc584','#3b6e3d','#68a0dc','#2a4a9e','#a07fcf','#55235a','#c264d0'];
const isBlack=m=>[1,3,6,8,10].includes(m%12);
const dOf=m=>Math.floor(m/12)*7+DIA[m%12];
const MODES={t1:{c:'t',lo:60,hi:72},t2:{c:'t',lo:60,hi:84},b1:{c:'b',lo:48,hi:60},b2:{c:'b',lo:36,hi:60}};
const NS='http://www.w3.org/2000/svg', sky=document.getElementById('sky'), kb=document.getElementById('kb'), msg=document.getElementById('msg');
let INK='#10294d',GC={d:'#8b5a2b',t:'#5fbf4a',h:'#9be884'};const S=.8, SURF=7, LAND=10, GY=262;
let curUser='';const USERK=['kt_prog2','kt_last','kt_animal','kt_easy','kt_ins'];
const uk=(k,id)=>{const u=id!==undefined?id:curUser;return u&&USERK.includes(k)?'u'+u+'_'+k:k};
const ls=(k,v,id)=>{try{if(v===undefined)return localStorage.getItem(uk(k,id));localStorage.setItem(uk(k,id),v)}catch(e){return null}};
const INS=[
 {n:'Piano',e:'🎹',parts:[[1,1],[2,.35],[3,.12],[4,.05]],type:'sine',a:.01,len:1.6},
 {n:'Synt',e:'🎛️',parts:[[1,1]],type:'sawtooth',a:.02,len:1.4,lp:1600,vol:.5},
 {n:'Fiol',e:'🎻',parts:[[1,1]],type:'sawtooth',a:.07,len:1.3,sus:1,vib:5.5,vd:10,lp:3000,vol:.45},
 {n:'Cello',e:'🎼',parts:[[1,1]],type:'sawtooth',a:.12,len:1.5,sus:1,vib:5,vd:7,lp:1100,vol:.6},
 {n:'Trumpet',e:'🎺',parts:[[1,1]],type:'sawtooth',a:.03,len:.9,sus:1,sweep:[2,7],q:2,vol:.4},
 {n:'Trombon',e:'📯',parts:[[1,1]],type:'sawtooth',a:.07,len:1.1,sus:1,sweep:[1.5,5],vib:4.5,vd:5,vol:.45},
 {n:'Röst',e:'🎤',parts:[[1,1]],type:'sawtooth',a:.07,len:1.2,sus:1,vib:5,vd:14,fm:[[800,6,1],[1150,6,.7],[2900,8,.3]],vol:1.4},
 {n:'Orgel',e:'⛪',parts:[[1,1],[2,.6],[3,.4],[4,.25]],type:'sine',a:.04,len:1.5,sus:1},
 {n:'Klockspel',e:'🔔',parts:[[1,1],[2,.25],[4,.1]],type:'sine',a:.003,len:1.3}];
let sel=new Set(INS.map(i=>i.n));
try{const z=JSON.parse(ls('kt_ins')||'null');if(z&&z.length)sel=new Set(z.filter(n=>INS.some(i=>i.n===n)))}catch(e){}
if(!sel.size)sel=new Set(['Piano']);
let ac,target=null,last=-1,locked=true,wrong=0,slot=0,started=false,cur=INS[0],score=+(ls('kt')||0),keys={};
const M=()=>MODES[document.getElementById('mode').value];
const blackOn=()=>document.getElementById('blk').checked;
const yOf=m=>230-(dOf(m)-(M().c==='t'?37:25))*10;
let N=8,X0=190,STEP=76,PS=1,LV=null,hearts=6,run=0,easy=ls('kt_easy')!=='0';
const xOf=i=>X0+i*STEP;
const enabled=m=>LV?LV.notes.includes(m):(blackOn()||!isBlack(m));
const unlocked=()=>INS.filter(i=>sel.has(i.n));
function chip(){document.getElementById('tot').textContent='⭐ '+total();document.getElementById('ins').textContent=cur.e+' '+cur.n}

// Tangentbord
function buildKeys(){
  kb.innerHTML='';keys={};
  const {lo,hi}=M(),whites=[];
  for(let m=lo;m<=hi;m++)if(!isBlack(m))whites.push(m);
  const w=100/whites.length,fs=whites.length>8?'clamp(.85rem,2.6vw,1.5rem)':'clamp(1.2rem,4vw,1.9rem)';
  const add=(m,cls,left,width)=>{
    const d=document.createElement('div');
    d.className=cls+(cls==='b'?' off':'');d.style.cssText=`left:${left}%;width:${width}%;background:${COL[m%12]};font-size:${fs}`;
    d.innerHTML=LET[m%12]+'<small>'+(Math.floor(m/12)-1)+'</small>';
    d.addEventListener('pointerdown',e=>{e.preventDefault();guess(m,d)});
    kb.appendChild(d);keys[m]=d;
  };
  whites.forEach((m,i)=>add(m,'w',i*w,w));
  for(let m=lo;m<=hi;m++)if(isBlack(m)){const i=whites.indexOf(m-1);add(m,'b',(i+1)*w-w*.32,w*.64)}
  syncBlack();
}
function syncBlack(){for(const m in keys)keys[m].classList.toggle('off',!enabled(+m))}
document.getElementById('blk').onchange=syncBlack;
document.getElementById('mode').onchange=()=>{if(!LV)startRun()};

// Ljud
function play(m,ins=cur,dur){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const f=440*Math.pow(2,(m-69)/12),t=ac.currentTime,out=ac.createGain(),bus=ac.createGain(),v=(ins.vol||1)*.35,L=dur||ins.len,fl=x=>Math.max(f*x,900);
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(v,t+ins.a);
  if(ins.sus){out.gain.setValueAtTime(v,t+L-.3);out.gain.linearRampToValueAtTime(0,t+L)}else out.gain.exponentialRampToValueAtTime(.001,t+L);
  out.connect(ac.destination);
  if(ins.fm)ins.fm.forEach(([fr,q,gn])=>{const bp=ac.createBiquadFilter(),gg=ac.createGain();bp.type='bandpass';bp.frequency.value=fr;bp.Q.value=q;gg.gain.value=gn;bus.connect(bp);bp.connect(gg);gg.connect(out)});
  else if(ins.lp||ins.sweep){const lp=ac.createBiquadFilter();lp.Q.value=ins.q||1;lp.frequency.setValueAtTime(ins.sweep?fl(ins.sweep[0]):ins.lp,t);if(ins.sweep)lp.frequency.linearRampToValueAtTime(fl(ins.sweep[1]),t+.12);bus.connect(lp);lp.connect(out)}
  else bus.connect(out);
  ins.parts.forEach(([k,a])=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type=ins.type;o.frequency.value=f*k;g.gain.value=a;
    if(ins.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=ins.vib;lg.gain.value=ins.vd||8;l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+L+.1)}
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+L+.1);
  });
}

// Notsystem
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||sky).appendChild(e);return e}
let bp,bi,bh,e1,e2,bn,bw,bgG,bwl,bkk;
const B={x:112,y:GY,hop:null,listen:0};

function ground(x0,x1){
  const g=el('g',{});
  el('rect',{x:x0,y:GY,width:x1-x0,height:90,rx:14,fill:GC.d},g);
  el('rect',{x:x0,y:GY,width:x1-x0,height:15,rx:7,fill:GC.t},g);
  el('rect',{x:x0+6,y:GY+2,width:x1-x0-12,height:3,rx:1.5,fill:GC.h},g);
}
function drawStaff(){
  if(!bgG){bgG=el('g',{});
    [[60,.5,1.3,70,-20],[130,.4,1,90,-55],[230,.35,.8,110,-80],[20,.45,1.1,80,-35],[290,.3,.7,120,-100]].forEach(([y,o,s,d,dl])=>{
      const a=el('g',{transform:`translate(0 ${y}) scale(${s})`,opacity:o},bgG),b=el('g',{class:'dc',style:`animation-duration:${d}s;animation-delay:${dl}s`},a);
      [[0,0,34,14],[-24,4,22,10],[26,5,24,10],[0,-8,20,12]].forEach(([dx,dy,rx,ry])=>el('ellipse',{cx:dx,cy:dy,rx,ry,fill:'#fff'},b));
    });}
  [...sky.children].forEach(c=>{if(c!==bgG)c.remove()});
  const dk=!!LV&&LV.w>12&&LV.w<26,bi_=LV&&LV.sing?'lake':BIOS[LV?LV.w%13:0],gc=GCB[bi_],rs=rng((LV?LV.w*17+LV.l:3)+99);
  INK=dk?'#e8e0ff':'#10294d';GC=dk?{d:sh(gc.d,-.55),t:sh(gc.t,-.5),h:sh(gc.h,-.45)}:gc;
  sky.style.background=dk?'linear-gradient(#1b1548,#4a2a7a)':`linear-gradient(${SKY[bi_][0]},${SKY[bi_][1]})`;
  document.body.style.background=dk?'linear-gradient(#150f3d,#3a2470)':'';document.body.style.color=dk?'#efe8ff':'';
  bgG.setAttribute('opacity',dk?.25:1);
  let sc=`<defs><linearGradient id="gdusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1f7a"/><stop offset="1" stop-color="#0b0824"/></linearGradient><radialGradient id="gfog"><stop offset="0" stop-color="#d8c8ff" stop-opacity=".7"/><stop offset="1" stop-color="#d8c8ff" stop-opacity="0"/></radialGradient></defs>`;
  if(dk){for(let i=0;i<40;i++)sc+=`<circle cx="${rs()*860}" cy="${rs()*200}" r="${1+rs()*1.3}" fill="#fff" opacity="${.4+rs()*.5}" class="${i%2?'tw':''}" style="animation-delay:${(i%7)*.4}s"/>`;
    sc+=`<circle cx="790" cy="46" r="24" fill="#fff4c2"/><circle cx="800" cy="40" r="21" fill="#1b1548"/>`}
  sc+=`<g opacity=".92">${bio(bi_,0,100,860,210,LV?LV.w*17+LV.l:3)}</g>`;
  if(dk){sc+=`<rect x="0" y="0" width="860" height="340" fill="url(#gdusk)" opacity=".5"/>`;
    for(let k=0;k<2;k++)sc+=`<ellipse class="fog" style="animation-delay:${-k*7}s" cx="${200+k*400}" cy="${275+k*6}" rx="230" ry="26" fill="url(#gfog)"/>`;
    for(let k=0;k<9;k++){const fx=40+rs()*780,fy=110+rs()*190;sc+=`<g class="ff" style="animation-delay:${-rs()*5}s"><circle cx="${fx}" cy="${fy}" r="7" fill="#d9ff7a" opacity=".3"/><circle cx="${fx}" cy="${fy}" r="2.4" fill="#f4ffb0"/></g>`}}
  el('g',{}).innerHTML=sc;
  el('rect',{x:20,y:118,width:820,height:150,rx:24,fill:dk?'#150f3d':'#fff',opacity:.36});
  for(let i=0;i<5;i++)el('line',{x1:20,x2:840,y1:150+i*20,y2:150+i*20,stroke:INK,'stroke-width':1.8,opacity:.55});
  ground(-10,150);ground(765,880);
  if(M().c==='t'){
    const c=el('g',{transform:'translate(62,210) scale(2.3)',opacity:.5});
    el('path',{d:'M2,22 C-2,25 -8,22 -6,17 C-4,14 1,15 1,19 L1,-14 C1,-26 7,-30 8,-22 C9,-14 0,-8 -7,-3 C-14,3 -9,13 0,12 C8,11 9,0 2,-2 C-4,-3 -6,5 -1,6',fill:'none',stroke:INK,'stroke-width':2.2,'stroke-linecap':'round'},c);
  }else{
    const c=el('g',{transform:'translate(48,170)',opacity:.5});
    el('circle',{cx:0,cy:0,r:6,fill:INK},c);
    el('path',{d:'M0,0 C2,-14 28,-14 28,8 C28,28 10,42 -10,52',fill:'none',stroke:INK,'stroke-width':5,'stroke-linecap':'round'},c);
    el('circle',{cx:38,cy:-9,r:3.5,fill:INK},c);el('circle',{cx:38,cy:9,r:3.5,fill:INK},c);
    
  }

  try{prog=JSON.parse(ls('kt_prog2')||'{}')}catch(e){prog={}}
  easy=ls('kt_easy')!=='0';animal=ls('kt_animal');if(!ANI[animal])animal='bunny';
  sel=new Set(INS.map(i=>i.n));try{const z=JSON.parse(ls('kt_ins')||'null');if(z&&z.length)sel=new Set(z.filter(n=>INS.some(i=>i.n===n)))}catch(e){}
  if(!sel.size)sel=new Set(['Piano']);
  cur=INS[0];buildIns();chip();
}
function addUser(name){
  name=name.trim().slice(0,16);
  if(!name)return 'Skriv ett namn först 🙂';
  if(users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return 'Det namnet finns redan';
  const id=Date.now().toString(36);
  if(!users.length)try{USERK.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)localStorage.setItem('u'+id+'_'+k,v)})}catch(e){}
  users.push({id,name});saveUsers();loadUser(id);showMap();return '';
}
function showProfiles(note){
  stopSing();run++;started=false;target=null;locked=true;
  document.body.style.background='';document.body.style.color='';
  document.getElementById('gameView').style.display='none';document.getElementById('mapView').style.display='none';
  const uv=document.getElementById('userView');uv.style.display='';
  uv.innerHTML=`<h1>👤 Vem spelar?</h1>${note?`<div id="banner">${note}</div>`:''}
  <div class="ulist">${users.map(u=>{const a=ls('kt_animal',undefined,u.id);return `<div class="ucard" data-id="${esc(u.id)}"><button class="ud" data-id="${esc(u.id)}">🗑️</button><div class="uav">${(ANI[a]||ANI.bunny).e}</div><div class="unm">${esc(u.name)}</div><div>⭐ ${totalOf(u.id)}</div></div>`}).join('')||'<div style="font-weight:800">Skriv ditt namn för att börja!</div>'}</div>
  <div class="bar"><input id="uname" maxlength="16" placeholder="Skriv ditt namn" autocomplete="off"><button id="uadd" class="gr">➕ Ny spelare</button></div>`;
  const add=()=>{const r=addUser(document.getElementById('uname').value);if(r)showProfiles(r)};
  document.getElementById('uadd').onclick=add;
  document.getElementById('uname').onkeydown=e=>{if(e.key==='Enter')add()};
  uv.querySelectorAll('.ucard').forEach(c=>c.onclick=()=>{loadUser(c.dataset.id);showMap()});
  uv.querySelectorAll('.ud').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='❓ Säker?';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='🗑️'}},3000);return}
    const id=b.dataset.id;try{USERK.forEach(k=>localStorage.removeItem('u'+id+'_'+k))}catch(err){}
    users=users.filter(u=>u.id!==id);saveUsers();if(curUser===id){curUser='';ls('kt_cur','')}
    showProfiles();
  });
}
buildIns();
(()=>{const id=ls('kt_cur');if(id&&users.some(u=>u.id===id)){loadUser(id);showMap()}else showProfiles()})();
</script>
